version: "3.9"

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_UPSTREAM_URL=http://api:8081
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
      - ./uploads:/app/uploads

