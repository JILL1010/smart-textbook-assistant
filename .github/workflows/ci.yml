name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: python -B -m unittest discover -s apps/api/tests -v
  web:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter web exec tsc --noEmit --incremental false
      - run: pnpm --filter web test
      - run: pnpm build
